name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run lint
        run: |
          chmod +x scripts/lint.sh
          ./scripts/lint.sh

  test:
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          chmod +x tests/test.sh app/app.sh
          ./tests/test.sh

  docker:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke test
        run: |
          chmod +x scripts/build.sh app/app.sh
          ./scripts/build.sh
